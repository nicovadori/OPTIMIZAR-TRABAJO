workflows:
  android-apk:
    name: Mi Jornada - Android APK
    instance_type: mac_mini_m1
    max_build_duration: 30
    environment:
      java: 17
    scripts:
      - name: Construir APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/**/*.apk
